# 从旧站配置恢复。主题通过 package.json 安装，不修改 node_modules。
info:
  title: Longtu Ma's
  author: Longtu Ma
  url: https://longtu-ma.github.io
defaults:
  favicon: /images/longtu-ma-logo.png
  logo: /images/longtu-ma-logo.png
  avatar: /images/longtu-ma-logo.png
colors:
  primary: '#A31F34'
  secondary: null
  default_mode: light
global:
  fonts:
    chinese:
      enable: false
      family: null
      url: null
    english:
      enable: false
      family: null
      url: null
  content_max_width: 1000px
  sidebar_width: 210px
  hover:
    shadow: true
    scale: false
  scroll_progress:
    bar: false
    percentage: true
  website_counter:
    url: https://cn.vercount.one/js
    enable: true
    site_pv: true
    site_uv: true
    post_pv: true
  single_page: true
  preloader: true
  open_graph: true
  google_analytics:
    enable: false
    id: null
home_banner:
  enable: true
  style: fixed
  image:
    light: /images/wallhaven-wqery6-light.webp
    dark: /images/wallhaven-wqery6-dark.webp
  title: Welcome to Longtu Ma's
  subtitle:
    text:
      - Glad to See You!
      - Have a Nice Day!
      - Enjoy Your Reading!
    hitokoto:
      enable: false
      api: https://v1.hitokoto.cn
    typing_speed: 100
    backing_speed: 80
    starting_delay: 500
    backing_delay: 1500
    loop: true
    smart_backspace: true
  text_color:
    light: '#fff'
    dark: '#d1d1b6'
  text_style:
    title_size: 2.8rem
    subtitle_size: 1.5rem
    line_height: 1.2
  custom_font:
    enable: false
    family: null
    url: null
  social_links:
    enable: false
    style: default
    links:
      github: https://github.com/Longtu-Ma
      instagram: null
      zhihu: null
      twitter: null
      email: 1931318775@qq.com; longtuma96@gmail.com
    qrs:
      weixin: wxid_euo0611px8g622
navbar:
  auto_hide: false
  color:
    left: '#f78736'
    right: '#367df7'
    transparency: 35
  width:
    home: 1200px
    pages: 1000px
  links:
    Home:
      path: /
      icon: fa-regular fa-house
    Archives:
      path: /archives
      icon: fa-regular fa-box-archive
    About:
      icon: fa-regular fa-user
      submenus:
        Me: /about
        Github: https://github.com/Longtu-Ma
        Blog: /
  search:
    enable: true
    preload: true
home:
  sidebar:
    enable: true
    position: left
    first_item: menu
    announcement: null
    show_on_mobile: true
    links:
      Archives:
        path: /archives
        icon: fa-regular fa-archive
      Tags:
        path: /tags
        icon: fa-regular fa-tags
      Categories:
        path: /categories
        icon: fa-regular fa-folder
  article_date_format: auto
  categories:
    enable: true
    limit: 3
  tags:
    enable: true
    limit: 3
articles:
  style:
    font_size: 16px
    line_height: 1.5
    image_border_radius: 14px
    image_alignment: center
    image_caption: false
    link_icon: true
    title_alignment: left
    headings_top_spacing:
      h1: 5rem
      h2: 4rem
      h3: 2.8rem
      h4: 2.5rem
      h5: 2.2rem
      h6: 2rem
  word_count:
    enable: true
    count: true
    min2read: true
  author_label:
    enable: true
    auto: false
    list: []
  code_block:
    copy: true
    style: mac
    font:
      enable: false
      family: null
      url: null
  toc:
    enable: true
    max_depth: 3
    number: false
    expand: true
    init_open: true
  copyright:
    enable: true
    default: cc_by_nc_sa
  lazyload: true
  recommendation:
    enable: false
    title: 推荐阅读
    limit: 3
    mobile_limit: 2
    placeholder: /images/wallhaven-wqery6-light.webp
    skip_dirs: []
page_templates:
  friends_column: 2
  tags_style: blur
plugins:
  feed:
    enable: false
  aplayer:
    enable: false
    type: fixed
    audios:
      - name: null
        artist: null
        url: null
        cover: null
        lrc: null
  mermaid:
    enable: false
    version: 9.3.0
comment:
  enable: false
footer:
  runtime: true
  start: 2022/8/17 11:45:14
  statistics: true
inject:
  enable: true
  head:
    - <link rel="stylesheet" href="/vendor/katex/katex.min.css">
    - <link rel="stylesheet" href="/css/blog-custom.css">
  footer: []
